name: CI Lidl offers

on:
  pull_request:
    branches:
      - "fase-5/backend-supabase"
    paths:
      - "scripts/import_lidl_weekly_offers.py"
      - "tests/test_import_lidl_weekly_offers.py"
      - ".github/workflows/ci-lidl-offers.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile importer and tests
        run: python -m py_compile scripts/import_lidl_weekly_offers.py tests/test_import_lidl_weekly_offers.py
      - name: Run normalization tests
        run: python -m unittest discover -s tests -p "test_import_lidl_weekly_offers.py" -v
