name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'fase-3/**'
      - 'fase-4/**'
      - 'fase-5/**'
      - 'fase-6/**'
  pull_request:
    branches:
      - main
      - 'fase-5/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Guardar lockfile reproducible en rama de desarrollo
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/fase-4/')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: guardar lockfile de npm'
            git push
          fi
      - name: Revisar vulnerabilidades de dependencias
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); console.log('Resumen de vulnerabilidades:', JSON.stringify(a.metadata?.vulnerabilities ?? {}, null, 2)); for (const [name, item] of Object.entries(a.vulnerabilities ?? {})) console.log(name + ': ' + item.severity + ', directo=' + item.isDirect + ', fix=' + JSON.stringify(item.fixAvailable));"
      - name: Auditar dependencias de producción
        run: npm audit --omit=dev --audit-level=moderate
      - name: Comprobar tipos y compilar
        run: npm run build
      - name: Configurar Python para la sonda Lidl
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[LIDL PROBE]')
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar sintaxis de la sonda Lidl
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[LIDL PROBE]')
        run: python -m py_compile scripts/probe_lidl_weekly_offers.py
      - name: Consultar ofertas Lidl (solo lectura)
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[LIDL PROBE]')
        env:
          LIDL_POSTAL_CODE: '12006'
          LIDL_PROBE_OUTPUT: lidl-offers-probe.json
        run: python scripts/probe_lidl_weekly_offers.py
      - name: Guardar resultado de la sonda Lidl
        if: always() && github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[LIDL PROBE]')
        uses: actions/upload-artifact@v4
        with:
          name: lidl-weekly-offers-probe
          path: lidl-offers-probe.json
          if-no-files-found: warn
          retention-days: 7
