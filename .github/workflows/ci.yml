name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'fase-3/**'
      - 'fase-4/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias
        run: npm install
      - name: Revisar vulnerabilidades de dependencias
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); console.log('Resumen de vulnerabilidades:', JSON.stringify(a.metadata?.vulnerabilities ?? {}, null, 2)); for (const [name, item] of Object.entries(a.vulnerabilities ?? {})) console.log(name + ': ' + item.severity + ', directo=' + item.isDirect + ', fix=' + JSON.stringify(item.fixAvailable));"
      - name: Auditar dependencias de producción
        run: npm audit --omit=dev --audit-level=moderate
      - name: Comprobar tipos y compilar
        run: npm run build
